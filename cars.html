    <title>Portfolio | Black & Gold</title>
    <style>
        :root {
            --bg-color: #000000;
            --accent-color: #FFD700;
            --text-color: #ffffff;
            --card-bg: #1a1a1a;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Header */
        header {
            padding: 1.5rem 10%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-color);
            background-color: rgba(0, 0, 0, 0.9);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-weight: 900;
            font-size: 1.5rem;
            letter-spacing: 2px;
        }

        .logo span { color: var(--accent-color); }

        /* Stil pentru butonul Home */
        .nav-menu {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .home-link {
            color: var(--text-color);
            text-decoration: none;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 8px 16px;
            border: 1px solid transparent;
            transition: all 0.3s ease;
        }

        .home-link:hover {
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            border-radius: 4px;
        }

        /* Galerie Grid */
        .gallery-container {
            padding: 4rem 10%;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            grid-auto-rows: 400px;
            gap: 20px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            background: var(--card-bg);
            border-radius: 8px;
            transition: transform 0.4s ease;
        }

        .gallery-item:hover {
            transform: scale(0.98);
            border: 2px solid var(--accent-color);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8;
            transition: opacity 0.4s ease;
        }

        .gallery-item:hover img {
            opacity: 1;
        }

        /* Overlay text */
        .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }

        .gallery-item:hover .overlay {
            transform: translateY(0);
        }

        .overlay h3 {
            margin: 0;
            color: var(--accent-color);
            font-size: 1.2rem;
        }

        /* Element Decorativ */
        .section-title {
            text-align: center;
            padding-top: 50px;
        }

        .section-title h2 {
            font-size: 3rem;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .yellow-line {
            width: 80px;
            height: 5px;
            background: var(--accent-color);
            margin: 10px auto 0;
        }
    </style>
</head>
