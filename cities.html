<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Black & Gold</title>
    <style>
        :root {
            --bg-color: #000000;
            --accent-color: #FFD700;
            --text-color: #ffffff;
            --card-bg: #1a1a1a;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Header */
        header {
            padding: 2rem 10%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-color);
        }

        .logo {
            font-weight: 900;
            font-size: 1.5rem;
            letter-spacing: 2px;
        }

        .logo span { color: var(--accent-color); }

        /* Galerie Grid */
        .gallery-container {
            padding: 4rem 10%;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            grid-auto-rows: 400px;
            gap: 20px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            background: var(--card-bg);
            border-radius: 8px;
            transition: transform 0.4s ease;
        }

        .gallery-item:hover {
            transform: scale(0.98);
            border: 2px solid var(--accent-color);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8;
            transition: opacity 0.4s ease;
        }

        .gallery-item:hover img {
            opacity: 1;
        }

        /* Overlay text */
        .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }

        .gallery-item:hover .overlay {
            transform: translateY(0);
        }

        .overlay h3 {
            margin: 0;
            color: var(--accent-color);
            font-size: 1.2rem;
        }

        /* Element Decorativ */
        .section-title {
            text-align: center;
            padding-top: 50px;
        }

        .section-title h2 {
            font-size: 3rem;
            text-transform: uppercase;
        }

        .yellow-line {
            width: 80px;
            height: 5px;
            background: var(--accent-color);
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">R<span>M</span>N</div>
    </header>

    <div class="section-title">
        <h2>Portfolio <span></span></h2>
        <h3>Cities</h3>
        <div class="yellow-line"></div>
    </div>

    <main class="gallery-container">
        <!-- Item 1 -->
        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1493238792040-81564986bbac?auto=format&fit=crop&q=80&w=800" alt="Foto">
            <div class="overlay">
                <h3>Urban Night</h3>
                <p>Street Photography</p>
            </div>
        </div>

        <!-- Item 2 -->
        <div class="gallery-item" style="grid-row: span 2;">
            <img src="https://images.unsplash.com/photo-1502982722880-0e8ce940d85f?auto=format&fit=crop&q=80&w=800" alt="Foto">
            <div class="overlay">
                <h3>Portrait Study</h3>
                <p>Fashion</p>
            </div>
        </div>

        <!-- Item 3 -->
        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&q=80&w=800" alt="Foto">
            <div class="overlay">
                <h3>Nature Vibes</h3>
                <p>Landscape</p>
            </div>
        </div>

        <!-- Item 4 -->
        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1554080353-a576cf803bda?auto=format&fit=crop&q=80&w=800" alt="Foto">
            <div class="overlay">
                <h3>Abstract Vision</h3>
                <p>Fine Art</p>
            </div>
        </div>
    </main>

</body>
</html>
