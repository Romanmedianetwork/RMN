<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            /* Fundal negru cu un gradient subtil */
            background: radial-gradient(circle, #1a1a1a, #000000);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: #111;
            padding: 40px;
            border-radius: 15px;
            /* Border galben pentru evidențiere */
            border: 2px solid #ffcc00;
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.2);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #ffcc00; /* Titlu Galben */
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            margin-bottom: 25px;
            color: #cccccc;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            margin-bottom: 15px;
            font-weight: bold;
        }
        .contact-info {
            font-size: 18px;
        }
        /* Stiluri pentru link-uri */
        a {
            color: #ffcc00;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        a:hover {
            color: #fff;
            text-shadow: 0 0 10px #ffcc00;
        }
        /* Un mic detaliu pentru etichete (Adress, Phone, Email) */
        span.label {
            color: #888;
            font-size: 14px;
            display: block;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Contact</h1>
        <p>Pentru orice întrebări sau solicitări, vă rugăm să ne contactați folosind informațiile de mai jos:</p>
        <ul class="contact-info">
            <li>
                <span class="label">Adresă</span>
                România
            </li>
            <li>
                <span class="label">Telefon</span>
                <a href="https://wa.me/+40752770173">+40 759 915 098</a>
            </li>
            <li>
                <span class="label">Email</span>
                <a href="mailto:roman.medianetwork@gmail.com">roman.medianetwork@gmail.com</a>
            </li>
        </ul>
    </div>
</body>
</html>
