<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMN - Foldere Media</title>
    <!-- Importăm un font modern similar cu cel de pe site -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <!-- Font Awesome pentru iconițe elegante -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #000000; /* Fundal negru ca pe site */
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            width: 90%;
            max-width: 1000px;
            padding: 20px;
        }

        .folder-card {
            background: #111111; /* Carduri gri foarte închis */
            border: 1px solid #333333; /* Border discret */
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        /* Efect de hover ca pe site-urile premium */
        .folder-card:hover {
            border-color: #ffffff;
            transform: translateY(-10px);
            background: #161616;
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.05);
        }

        .icon-wrapper {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #ffffff;
            opacity: 0.9;
        }

        .folder-card h3 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .folder-card p {
            font-size: 0.8rem;
            color: #666;
            margin-top: 10px;
            text-transform: none;
        }

        /* Element decorativ discret (linie jos) */
        .folder-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: #fff;
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }

        .folder-card:hover::after {
            width: 40%;
        }
    </style>
</head>
<body>

    <div class="grid-container">
        <!-- People -->
        <a href="people.html" class="folder-link">
        <div class="folder-card">
            <div class="icon-wrapper">
                <i class="fa-solid fa-users"></i>
            </div>
            <h3>People</h3>
            <p>Photo</p>
        </div>

        <!-- Cars -->
        <a href="cars.html" class="folder-link">
        <div class="folder-card">
            <div class="icon-wrapper">
                <i class="fa-solid fa-car-side"></i>
            </div>
            <h3>Automobiles</h3>
            <p>Photo</p>        </div>

        <!-- Cites -->
        <a href="cities.html" class="folder-link">
        <div class="folder-card">
            <div class="icon-wrapper">
                <i class="fa-solid fa-city"></i>
            </div>
            <h3>Cities</h3>
            <p>Photo</p>
        </div>

                    <!-- Cites -->
        <a href="video.html" class="folder-link">
        <div class="folder-card">
            <div class="icon-wrapper">
                <i class="fa-solid fa-city"></i>
            </div>
            <h3>Video</h3>
        </div>
    </div>

</body>
</html>
